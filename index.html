<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f6f4ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><title>Lanto – iPhone MVP</title><style>:root{--bg:#f6f4ee;--card:#fff;--ink:#20211f;--muted:#85847e;--line:#e7e3da;--accent:#2d6754}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}body{min-height:100vh}#app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:92px}header{position:sticky;top:0;z-index:3;background:rgba(246,244,238,.95);backdrop-filter:blur(16px);padding:calc(16px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;font-size:24px}.crumb{font-size:12px;color:var(--muted);margin-top:2px}.home{border:0;background:none;font-size:20px;padding:8px}main{padding:12px 14px}.back{border:0;background:none;color:var(--accent);font-weight:650;padding:7px 2px 12px;font-size:15px}.row{background:var(--card);border:1px solid var(--line);border-radius:17px;min-height:58px;margin:8px 0;display:flex;align-items:stretch;overflow:hidden;touch-action:pan-y;transition:opacity .18s}.row.done{opacity:.42}.arrow{width:45px;border:0;background:none;font-size:22px;color:#6f6f69}.name{flex:1;text-align:left;border:0;background:none;padding:15px 5px 15px 0;font-weight:600;font-size:16px;color:var(--ink)}.badge{align-self:center;margin-right:14px;font-size:11px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}.card h2{margin:0 0 8px;font-size:20px}.ctx{padding:13px 0;border-top:1px solid var(--line)}.ctx:first-of-type{border-top:0}.ctx img{display:block;width:100%;border-radius:13px}.link{border:0;background:none;color:var(--accent);font-size:16px;padding:0;font-weight:650}.pill{display:inline-block;padding:7px 10px;background:#edf2ee;border-radius:999px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:36px 12px}.composer{position:fixed;bottom:0;left:0;right:0;z-index:4;padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}.compose{max-width:680px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:19px;display:flex;padding:6px}.compose input{min-width:0;flex:1;border:0;outline:0;font-size:16px;padding:10px 11px;background:transparent}.compose button{border:0;background:#20211f;color:#fff;border-radius:14px;padding:0 16px;font-size:20px}.overlay{display:none;position:fixed;inset:0;background:#000;z-index:20;color:#fff;flex-direction:column}.overlay.show{display:flex}.bar{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between}.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center}.stage img{max-width:100%;max-height:100%;object-fit:contain}.zone{position:absolute;top:0;bottom:0;width:50%}.zone.l{left:0}.zone.r{right:0}.hint{opacity:.65;font-size:12px}.toast{position:fixed;z-index:30;left:50%;bottom:105px;transform:translateX(-50%);background:#20211f;color:#fff;border-radius:999px;padding:9px 13px;font-size:13px;display:none}</style></head><body><div id="app"><header><div class="top"><div><div class="brand">Lanto</div><div class="crumb" id="crumb">Beispielbereich</div></div><button class="home" id="home">⌂</button></div></header><main id="main"></main><div class="composer"><div class="compose"><input id="input" placeholder="Was möchtest du hinzufügen?"><button id="add">+</button></div></div></div><div class="overlay" id="overlay"><div class="bar"><span id="photoTitle">Beispielbild</span><span class="hint">Wischen zum Zurück</span></div><div class="stage" id="stage"><div class="zone l" id="prev"></div><img id="img" alt="Beispielbild"><div class="zone r" id="next"></div></div></div><div class="toast" id="toast"></div><script>const demoImage='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650"><rect width="100%" height="100%" fill="#e5e1d7"/><rect x="190" y="140" width="520" height="300" rx="30" fill="#fff" stroke="#555" stroke-width="8"/><text x="450" y="315" text-anchor="middle" font-size="52" fill="#333">BEISPIELBILD</text></svg>');const root={id:'root',name:'Beispielbereich',children:[{id:'alpha',name:'Projekt Alpha',context:[{kind:'text',text:'Beispieltext – keine persönlichen Daten.'},{kind:'image',title:'Beispielbild',src:demoImage}]},{id:'planung',name:'Planung',context:[{kind:'link',label:'→ Projekt Alpha',target:'alpha'}]},{id:'sammlung',name:'Sammlung',children:[{id:'unterpunkt',name:'Unterpunkt Beispiel'}]},{id:'erinnerung',name:'Beispiel-Erinnerung',context:[{kind:'alarm',text:'Beispieldatum · 10:00'}]}]};let current='root',history=[],photos=[],pi=0;function find(id,n=root){if(n.id===id)return n;for(const c of n.children||[]){const r=find(id,c);if(r)return r}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const n=find(current);document.getElementById('crumb').textContent=n.id==='root'?'Beispielbereich':n.name;const main=document.getElementById('main');main.innerHTML='';if(n.id!=='root'){const b=document.createElement('button');b.className='back';b.textContent='← Zurück';b.onclick=back;main.append(b)}const list=document.createElement('div');(n.children||[]).forEach(c=>list.append(row(c)));if(!n.children?.length&&!n.context?.length)list.innerHTML='<div class="empty">Noch kein Kontext.</div>';main.append(list);if(n.context?.length){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Kontext</h2>'+n.context.map((x,i)=>ctx(x,i,n)).join('');main.append(card)}}function row(n){const r=document.createElement('div');r.className='row'+(n.done?' done':'');const has=n.children?.length||n.context?.length;const a=document.createElement('button');a.className='arrow';a.textContent=has?'›':'';a.onclick=()=>open(n.id);const b=document.createElement('button');b.className='name';b.textContent=n.name;b.onclick=()=>open(n.id);r.append(a,b);if(n.context?.length){const t=document.createElement('span');t.className='badge';t.textContent='Kontext';r.append(t)}let sx=0;r.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});r.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>65){if(dx<0){n.done=true;toast('Punkt ausgegraut')}else if(n.done){n.done=false;toast('Punkt wieder aktiv')}render()}},{passive:true});return r}function open(id){if(current!==id)history.push(current);current=id;render()}function back(){current=history.pop()||'root';render()}function ctx(x,i,n){if(x.kind==='image')return '<div class="ctx"><b>'+esc(x.title)+'</b><img src="'+x.src+'" data-img="'+i+'" data-node="'+n.id+'" alt="Beispielbild"></div>';if(x.kind==='link')return '<div class="ctx"><button class="link" onclick="open(\''+x.target+'\')">'+esc(x.label)+'</button></div>';if(x.kind==='alarm')return '<div class="ctx"><span class="pill">⏰ '+esc(x.text)+'</span></div>';return '<div class="ctx">'+esc(x.text)+'</div>'}document.addEventListener('click',e=>{if(e.target.matches('img[data-img]')){const n=find(e.target.dataset.node);photos=(n.context||[]).filter(x=>x.kind==='image');pi=+e.target.dataset.img;showPhoto()}});function showPhoto(){if(!photos[pi])return;document.getElementById('img').src=photos[pi].src;document.getElementById('photoTitle').textContent=photos[pi].title;document.getElementById('overlay').classList.add('show')}document.getElementById('next').onclick=()=>{if(photos.length>1){pi=(pi+1)%photos.length;showPhoto()}};document.getElementById('prev').onclick=()=>{if(photos.length>1){pi=(pi-1+photos.length)%photos.length;showPhoto()}};let ps=0;document.getElementById('stage').addEventListener('touchstart',e=>ps=e.changedTouches[0].clientX,{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{if(e.changedTouches[0].clientX-ps>65)document.getElementById('overlay').classList.remove('show')},{passive:true});document.getElementById('home').onclick=()=>{current='root';history=[];render()};document.getElementById('add').onclick=()=>{const v=document.getElementById('input').value.trim();if(!v)return;const n=find(current);n.context=n.context||[];n.context.unshift({kind:'text',text:v});document.getElementById('input').value='';render();toast('Hinzugefügt')};document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('add').click()});function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1200)}render();</script></body></html>
