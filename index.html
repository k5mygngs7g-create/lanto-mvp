<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f5f4ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Lanto</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--text:#20211f;--muted:#77786f;--line:#e4e2d9;--accent:#2d6b57;--soft:#edf2ee}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{overscroll-behavior:none}.app{width:min(720px,100%);margin:auto;min-height:100vh;padding-bottom:92px}
header{position:sticky;top:0;z-index:3;background:rgba(245,244,239,.94);backdrop-filter:blur(12px);padding:16px 18px 10px;border-bottom:1px solid rgba(228,226,217,.7);display:flex;align-items:center;gap:12px}
.brand{flex:1}.brand h1{margin:0;font-size:24px}.crumb{font-size:12px;color:var(--muted);margin-top:2px}.home{border:0;background:var(--card);width:40px;height:40px;border-radius:14px;border:1px solid var(--line);font-size:18px}
main{padding:14px}.hint{font-size:13px;color:var(--muted);padding:6px 4px 12px}.list{display:flex;flex-direction:column;gap:8px}
.item-wrap{touch-action:pan-y}.item{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:17px;min-height:58px;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.02)}
.item.done{opacity:.42}.arrow{width:46px;border:0;background:transparent;font-size:22px;color:#67685f}.name{flex:1;display:flex;align-items:center;padding:15px 8px 15px 0;font-weight:600}.meta{display:flex;align-items:center;padding:0 13px;color:var(--muted);font-size:11px}.children{margin:8px 0 0 22px;padding-left:9px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.detail{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.detail h2{margin:0 0 12px;font-size:16px}.back{border:0;background:transparent;color:var(--accent);font-weight:650;padding:6px 0;margin-bottom:4px}.context{padding:12px 0;border-top:1px solid var(--line)}.context:first-of-type{border-top:0}.context img{width:100%;max-height:420px;object-fit:contain;border-radius:14px;background:#eee}.context .small{font-size:12px;color:var(--muted)}.link{border:0;background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--text);font-weight:650}.alarm{display:inline-block;background:var(--soft);border-radius:999px;padding:7px 10px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:38px 8px}
.composer{position:fixed;z-index:4;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}.composer-inner{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 7px;box-shadow:0 8px 30px rgba(0,0,0,.07)}.composer input{flex:1;border:0;outline:0;background:transparent;padding:10px;font-size:16px}.composer button{border:0;border-radius:13px;background:#20211f;color:#fff;width:44px;font-size:20px}
.overlay{display:none;position:fixed;inset:0;background:#000;color:#fff;z-index:20;flex-direction:column}.overlay.show{display:flex}.photo-head{display:flex;justify-content:space-between;padding:12px 16px;font-size:13px}.photo-area{position:relative;flex:1;display:flex;align-items:center;justify-content:center}.photo-area img{max-width:100%;max-height:100%;object-fit:contain}.zone{position:absolute;top:0;bottom:0;width:50%;z-index:2}.zone.left{left:0}.zone.right{right:0}.photo-foot{text-align:center;padding:10px;font-size:12px;opacity:.7}
.toast{position:fixed;z-index:50;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:9px 14px;font-size:13px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(720px,100%);background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.18)}.sheet h3{margin:0 0 12px}.sheet button{width:100%;text-align:left;border:0;background:transparent;padding:13px 8px;border-radius:12px;font-size:16px}.sheet button:hover{background:var(--bg)}
.chat{display:none;position:fixed;inset:0;background:var(--bg);z-index:25;flex-direction:column}.chat.show{display:flex}.chat-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:rgba(245,244,239,.94)}.chat-body{flex:1;padding:16px;overflow:auto}.bubble{max-width:85%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin:8px 0}.bubble.me{margin-left:auto;background:var(--soft)}.chat-compose{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.chat-compose input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px}.chat-compose button{border:0;border-radius:14px;background:#20211f;color:#fff;padding:0 16px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><h1>Lanto</h1><div class="crumb" id="crumb">Meine Punkte</div></div><button class="home" id="home">⌂</button></header>
<main id="main"></main>
<div class="composer"><div class="composer-inner"><input id="input" placeholder="Was möchtest du hinzufügen?"><button id="add">+</button></div></div>
</div>
<div class="overlay" id="viewer"><div class="photo-head"><span id="photoTitle">Bild</span><span>Swipe ←→</span></div><div class="photo-area" id="photoArea"><div class="zone left" id="photoPrev"></div><img id="photoImg" alt=""><div class="zone right" id="photoNext"></div></div><div class="photo-foot">Links: vorheriges · Rechts: nächstes · Swipe von links nach rechts: zurück</div></div>
<div class="modal" id="sheet"><div class="sheet"><h3 id="sheetTitle">Punkt</h3><button data-action="chat">Lanto fragen</button><button data-action="context">Kontext hinzufügen</button><button data-action="room">Raum gestalten</button><button data-action="delete">Löschen</button><button data-action="cancel">Abbrechen</button></div></div>
<div class="chat" id="chat"><div class="chat-head"><button class="home" id="chatBack">←</button><strong id="chatTitle">Lanto</strong></div><div class="chat-body" id="chatBody"></div><div class="chat-compose"><input id="chatInput" placeholder="Lanto fragen …"><button id="chatSend">Senden</button></div></div>
<div class="toast" id="toast"></div>
<script>
const img1='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"><rect width="100%" height="100%" fill="#e9e5db"/><rect x="230" y="145" width="540" height="360" rx="34" fill="white" stroke="#555" stroke-width="8"/><rect x="315" y="260" width="370" height="105" rx="12" fill="#222"/><text x="500" y="330" text-anchor="middle" font-size="58" fill="white" font-family="sans-serif">3421 kWh</text></svg>`);
const img2='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"><rect width="100%" height="100%" fill="#dedfd7"/><rect x="230" y="145" width="540" height="360" rx="34" fill="white" stroke="#555" stroke-width="8"/><rect x="315" y="260" width="370" height="105" rx="12" fill="#222"/><text x="500" y="330" text-anchor="middle" font-size="58" fill="white" font-family="sans-serif">3498 kWh</text></svg>`);
const state={root:{id:'root',name:'Meine Punkte',children:[
{id:'strom',name:'Strom',children:[{id:'zaehler',name:'Zählerstände',context:[{kind:'image',title:'Zählerstand – aktuell',src:img1},{kind:'image',title:'Zählerstand – vorher',src:img2},{kind:'text',text:'Letzter Stand: 3421 kWh'}]}]},
{id:'kalk',name:'Kalkulation',context:[{kind:'link',label:'⚡ Strom',target:'strom'}]},
{id:'umzug',name:'Umzug',children:[{id:'kueche',name:'Küche',children:[{id:'schraenke',name:'Schränke'}]}]},
{id:'anbieter',name:'Stromanbieter anrufen',context:[{kind:'alarm',text:'24.08. · 09:00'}]}
]},stack:[],current:'root',expanded:new Set(),photo:{items:[],index:0,node:null},menuNode:null};
function find(id,n=state.root){if(n.id===id)return n;for(const c of n.children||[]){const r=find(id,c);if(r)return r}return null}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const n=find(state.current);document.getElementById('crumb').textContent=n.id==='root'?'Meine Punkte':n.name;const main=document.getElementById('main');main.innerHTML='';if(n.id!=='root'){const b=document.createElement('button');b.className='back';b.textContent='← Zurück';b.onclick=back;main.appendChild(b)}
const list=document.createElement('div');list.className='list';const kids=(n.children||[]).filter(x=>!x.deleted);const active=kids.filter(x=>!x.done), done=kids.filter(x=>x.done);[...active,...done].forEach(x=>list.appendChild(renderItem(x)));main.appendChild(list);
if(n.id!=='root' && (n.context||[]).length){const d=document.createElement('div');d.className='detail';d.innerHTML='<h2>Kontext</h2>';n.context.forEach((x,i)=>d.appendChild(renderContext(x,i,n)));main.appendChild(d)}
if(n.id!=='root' && !kids.length && !(n.context||[]).length){main.innerHTML+='<div class="empty">Noch kein Kontext.</div>'}}
function renderItem(n){const wrap=document.createElement('div');wrap.className='item-wrap';const r=document.createElement('div');r.className='item'+(n.done?' done':'');const has=(n.children&&n.children.length)||(n.context&&n.context.length);const a=document.createElement('button');a.className='arrow';a.textContent=has?(state.expanded.has(n.id)?'⌄':'›'):'';a.onclick=e=>{e.stopPropagation();if(has){state.expanded.has(n.id)?state.expanded.delete(n.id):state.expanded.add(n.id);render()}else open(n.id)};const name=document.createElement('div');name.className='name';name.textContent=n.name;name.onclick=()=>open(n.id);r.append(a,name);if(n.context?.length){const m=document.createElement('div');m.className='meta';m.textContent='Kontext';r.append(m)}
let sx=0;r.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});r.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70){dx<0?gray(n):activate(n)}});let timer;r.addEventListener('pointerdown',()=>timer=setTimeout(()=>showMenu(n),650));['pointerup','pointercancel','pointerleave'].forEach(ev=>r.addEventListener(ev,()=>clearTimeout(timer)));wrap.appendChild(r);
if(state.expanded.has(n.id)){const ch=document.createElement('div');ch.className='children';(n.children||[]).filter(x=>!x.deleted).sort((a,b)=>sortKey(b)-sortKey(a)).forEach(c=>ch.appendChild(renderItem(c)));wrap.appendChild(ch)}return wrap}
function sortKey(n){return n.doneAt||n.createdAt||0}
function open(id){if(state.current!==id)state.stack.push(state.current);state.current=id;render()}
function back(){state.current=state.stack.pop()||'root';render()}
function gray(n){if(n.done)return;n.done=true;n.doneAt=Date.now();toast('Ausgegraut');render()}
function activate(n){if(!n.done)return;n.done=false;toast('Wieder aktiv');render()}
function showMenu(n){state.menuNode=n;document.getElementById('sheetTitle').textContent=n.name;document.getElementById('sheet').classList.add('show')}
function closeMenu(){document.getElementById('sheet').classList.remove('show')}
function addContext(n){const t=prompt('Kontext eingeben');if(t?.trim()){n.context=n.context||[];n.context.unshift({kind:'text',text:t.trim()});toast('Kontext hinzugefügt');render()}}
function showChat(n){closeMenu();document.getElementById('chatTitle').textContent='Lanto · '+n.name;document.getElementById('chatBody').innerHTML='<div class="bubble">Ich bin Lanto. Wir sprechen gerade über <b>'+esc(n.name)+'</b>.</div>';document.getElementById('chat').classList.add('show')}
function renderContext(x,i,n){const d=document.createElement('div');d.className='context';if(x.kind==='image'){const img=document.createElement('img');img.src=x.src;img.alt=x.title||'Bild';img.onclick=()=>openViewer(n,i);d.append(img);if(x.title){const s=document.createElement('div');s.className='small';s.textContent=x.title;d.append(s)}}else if(x.kind==='link'){const b=document.createElement('button');b.className='link';b.textContent=x.label;b.onclick=()=>open(x.target);d.append(b)}else if(x.kind==='alarm'){const a=document.createElement('span');a.className='alarm';a.textContent='⏰ '+x.text;d.append(a)}else d.textContent=x.text||'';return d}
function openViewer(n,i){const imgs=(n.context||[]).filter(x=>x.kind==='image');state.photo={items:imgs,index:Math.max(0,imgs.findIndex(x=>x===n.context[i])),node:n};if(state.photo.index<0)state.photo.index=0;showPhoto();document.getElementById('viewer').classList.add('show')}
function showPhoto(){const p=state.photo.items[state.photo.index];if(!p)return;document.getElementById('photoImg').src=p.src;document.getElementById('photoTitle').textContent=p.title||'Bild'}
function photoNext(){if(state.photo.items.length>1){state.photo.index=(state.photo.index+1)%state.photo.items.length;showPhoto()}}
function photoPrev(){if(state.photo.items.length>1){state.photo.index=(state.photo.index-1+state.photo.items.length)%state.photo.items.length;showPhoto()}}
document.getElementById('photoNext').onclick=photoNext;document.getElementById('photoPrev').onclick=photoPrev;let ps=0;document.getElementById('photoArea').addEventListener('touchstart',e=>ps=e.changedTouches[0].clientX,{passive:true});document.getElementById('photoArea').addEventListener('touchend',e=>{if(e.changedTouches[0].clientX-ps>70)document.getElementById('viewer').classList.remove('show')});
document.querySelectorAll('#sheet button').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action,n=state.menuNode;if(a==='cancel')closeMenu();else if(a==='chat')showChat(n);else if(a==='context'){closeMenu();addContext(n)}else if(a==='room'){closeMenu();toast('Raum gestalten – MVP-Platzhalter')}else if(a==='delete'){closeMenu();n.deleted=true;toast('Gelöscht');render()}}));
document.getElementById('home').onclick=()=>{state.current='root';state.stack=[];render()};document.getElementById('chatBack').onclick=()=>document.getElementById('chat').classList.remove('show');document.getElementById('chatSend').onclick=sendChat;document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});function sendChat(){const v=document.getElementById('chatInput').value.trim();if(!v)return;const body=document.getElementById('chatBody');const me=document.createElement('div');me.className='bubble me';me.textContent=v;body.append(me);const reply=document.createElement('div');reply.className='bubble';reply.textContent='Verstanden. Im MVP ist dies die Chat-Fläche für diesen Punkt.';body.append(reply);document.getElementById('chatInput').value='';body.scrollTop=body.scrollHeight}
document.getElementById('add').onclick=()=>{const v=document.getElementById('input').value.trim();if(!v)return;const n=find(state.current);n.context=n.context||[];n.context.unshift({kind:'text',text:v,createdAt:Date.now()});document.getElementById('input').value='';toast('Hinzugefügt');render()};document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('add').click()});function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>x.style.display='none',1300)}
render();
</script></body></html>
